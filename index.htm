<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script
    src="https://cdn.utmify.com.br/scripts/utms/latest.js"
    data-utmify-prevent-xcod-sck
    data-utmify-prevent-subids
    async
    defer
  ></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desenrola Brasil</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      background: #ececec;
    }

    .access-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .access-header {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid #dfe3eb;
      box-shadow: 0 2px 8px rgba(20, 81, 180, 0.08);
    }

    .access-brand {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .access-brand-icon {
      width: 48px;
      height: auto;
    }

    .access-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 42px 20px;
      background:
        radial-gradient(circle at 12% 15%, rgba(19, 81, 180, 0.12), transparent 28%),
        radial-gradient(circle at 88% 85%, rgba(20, 113, 180, 0.1), transparent 30%),
        #f3f5f8;
    }

    .access-card {
      width: 100%;
      max-width: 570px;
      padding: 42px 38px 38px;
      text-align: center;
      background: #fff;
      border: 1px solid #e1e6ef;
      border-radius: 16px;
      box-shadow: 0 12px 34px rgba(28, 54, 92, 0.12);
    }

    .security-icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      color: #fff;
      background: #1451b4;
      border-radius: 50%;
      box-shadow: 0 7px 18px rgba(20, 81, 180, 0.25);
    }

    .access-card h1 {
      margin-bottom: 12px;
      color: #174ea6;
      font-size: 28px;
      line-height: 1.25;
    }

    .access-card p {
      max-width: 430px;
      margin: 0 auto 28px;
      color: #4b5563;
      font-size: 16px;
      line-height: 1.55;
    }

    .access-button {
      width: 100%;
      min-height: 52px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      color: #fff;
      background: #1451b4;
      border-radius: 999px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 5px 14px rgba(20, 81, 180, 0.24);
      transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .access-button:hover {
      background: #0c3d8f;
      transform: translateY(-1px);
      box-shadow: 0 7px 18px rgba(20, 81, 180, 0.3);
    }

    .access-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-top: 18px;
      color: #667085;
      font-size: 13px;
    }

    .access-footer {
      padding: 24px 20px;
      text-align: center;
      color: #6b7280;
      background: #fff;
      border-top: 1px solid #e1e6ef;
      font-size: 13px;
    }

    .access-footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px 22px;
      margin-bottom: 10px;
    }

    .access-footer a {
      color: #1451b4;
      font-weight: 600;
      text-decoration: none;
    }

    .access-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 560px) {
      .access-header {
        min-height: 66px;
        padding: 14px 18px;
      }

      .access-brand-icon {
        width: 40px;
      }

      .access-main {
        padding: 24px 14px;
      }

      .access-card {
        padding: 32px 20px 28px;
        border-radius: 13px;
      }

      .security-icon {
        width: 60px;
        height: 60px;
        margin-bottom: 18px;
      }

      .access-card h1 {
        font-size: 23px;
      }

      .access-card p {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <div class="access-page">
    <header class="access-header">
      <div class="access-brand" aria-label="Desenrola Brasil">
        <img class="access-brand-icon" src="images/logo-icon.png" alt="">
      </div>
    </header>

    <main class="access-main">
      <section class="access-card">
        <div class="security-icon" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <h1>Verificação de acesso</h1>
        <p>Para continuar para a plataforma, confirme que você é uma pessoa.</p>
        <a class="access-button" href="./entrar/">Não sou um robô e quero prosseguir</a>
        <div class="access-note">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2"></rect>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
          </svg>
          Ambiente protegido e conexão segura
        </div>
      </section>
    </main>

    <footer class="access-footer">
      <nav class="access-footer-links" aria-label="Links legais">
        <a href="politica-privacidade.html">Política de Privacidade</a>
        <a href="termos-de-uso.html">Termos de Uso</a>
      </nav>
      <span>&copy; 2025 Todos os direitos reservados.</span>
    </footer>
  </div>
</body>
</html>
